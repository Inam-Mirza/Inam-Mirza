<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-labelledby="ft" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="ft">Design with intent. Code with curiosity. Inam Ur Rehman.</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1E1E1E"/>
    </pattern>
    <radialGradient id="focus" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="160" fill="#0A0A0A"/>
  <rect width="1200" height="160" fill="url(#dots)"/>
  <rect width="1200" height="160" fill="url(#focus)"/>

  <!-- Crop marks -->
  <g stroke="#E10600" stroke-width="2" fill="none" stroke-linecap="square">
    <path d="M24 44 V24 H44"/>
    <path d="M1156 24 H1176 V44"/>
    <path d="M24 116 V136 H44"/>
    <path d="M1156 136 H1176 V116"/>
  </g>

  <!-- Center registration mark with rules -->
  <g stroke="#E10600" stroke-width="1.5" fill="none">
    <circle cx="600" cy="36" r="7"/>
    <path d="M600 24 V48 M588 36 H612"/>
  </g>
  <g stroke="#2A2A2A" stroke-width="1">
    <path d="M120 36 H574"/>
    <path d="M626 36 H1080"/>
  </g>

  <text x="600" y="92" text-anchor="middle" fill="#E5E5E5"
        font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
        font-size="16" letter-spacing="5">DESIGN WITH INTENT. CODE WITH CURIOSITY.</text>

  <text x="600" y="122" text-anchor="middle" fill="#8A8A8A"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="12" letter-spacing="6">INAM UR REHMAN</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
