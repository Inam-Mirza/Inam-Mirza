    <radialGradient id="focus" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="320" fill="#0A0A0A"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#focus)"/>

  <!-- Crop marks (print-design nod) -->
  <g stroke="#E10600" stroke-width="2" fill="none" stroke-linecap="square">
    <path d="M24 52 V24 H52"/>
    <path d="M1148 24 H1176 V52"/>
    <path d="M24 268 V296 H52"/>
    <path d="M1148 296 H1176 V268"/>
  </g>

  <!-- Registration marks top / bottom center -->
  <g stroke="#E10600" stroke-width="1.5" fill="none">
    <circle cx="600" cy="34" r="7"/>
    <path d="M600 22 V46 M588 34 H612"/>
    <circle cx="600" cy="286" r="7"/>
    <path d="M600 274 V298 M588 286 H612"/>
  </g>

  <!-- Name -->
  <text x="600" y="152" text-anchor="middle" fill="#FFFFFF"
