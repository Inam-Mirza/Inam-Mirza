<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="bt" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="bt">Inam Ur Rehman, Graphic Designer and Aspiring Developer</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
